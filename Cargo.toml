[package]
name = "imk-aac"
version = "0.1.3"
edition = "2024"
publish = false
license = "Apache-2.0"
repository = "https://github.com/musingfox/imk-aac"

[dependencies]
ap-client = { version = "=0.11.0", features = ["native-websocket"] }
ap-noise = "=0.11.0"
ap-proxy-protocol = "=0.11.0"
async-trait = "0.1"
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "process", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
zeroize = "1"
